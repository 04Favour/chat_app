<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestJS Chat Client</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 95%;
            margin: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .auth-container, .chat-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .auth-container {
            max-width: 450px;
            margin: 0 auto;
        }

        .chat-container {
            display: none;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            background: #ffe5e5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            color: #27ae60;
            background: #e5f7e5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            width: auto;
            font-size: 14px;
        }

        #messages {
            height: 450px;
            overflow-y: auto;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
        }

        /* ==================== MESSAGE BUBBLES ==================== */
        
        .message-wrapper {
            display: flex;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* OTHER PEOPLE'S MESSAGES - LEFT SIDE */
        .message-wrapper.other {
            justify-content: flex-start;
        }

        .message-wrapper.other .message {
            background: white;
            color: #333;
            border-radius: 18px 18px 18px 4px;
            max-width: 70%;
            padding: 12px 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-wrapper.other .message-header {
            font-weight: 700;
            color: #667eea;
            font-size: 13px;
            margin-bottom: 4px;
        }

        /* YOUR MESSAGES - RIGHT SIDE */
        .message-wrapper.own {
            justify-content: flex-end;
        }

        .message-wrapper.own .message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
            max-width: 70%;
            padding: 12px 16px;
            box-shadow: 0 2px 5px rgba(102, 126, 234, 0.3);
        }

        .message-wrapper.own .message-header {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        /* MESSAGE CONTENT */
        .message-content {
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 15px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .message-wrapper.other .message-time {
            color: #999;
        }

        .message-wrapper.own .message-time {
            color: rgba(255,255,255,0.8);
        }

        /* SYSTEM MESSAGES */
        .system-message {
            text-align: center;
            color: #999;
            font-size: 13px;
            font-style: italic;
            margin: 10px 0;
            padding: 8px;
            background: rgba(0,0,0,0.03);
            border-radius: 12px;
        }

        .message-input-container {
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
        }

        .send-btn {
            width: 120px;
        }

        #typing-indicator {
            color: #667eea;
            font-style: italic;
            font-size: 13px;
            min-height: 20px;
            padding: 5px 15px;
        }

        .online-users {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .online-users strong {
            color: #27ae60;
        }

        /* Scrollbar styling */
        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 NestJS Chat Application</h1>

        <!-- Authentication Container -->
        <div class="auth-container" id="auth-container">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Login</button>
                <button class="tab" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div class="tab-content active" id="login-tab">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="login-username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit">Login</button>
                    <div class="error-message" id="login-error"></div>
                </form>
            </div>

            <!-- Register Form -->
            <div class="tab-content" id="register-tab">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="register-username" placeholder="Choose a username" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="register-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="register-password" placeholder="Choose a password" required minlength="6">
                    </div>
                    <button type="submit">Create Account</button>
                    <div class="error-message" id="register-error"></div>
                    <div class="success-message" id="register-success"></div>
                </form>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chat-container">
            <div class="chat-header">
                <div>
                    <h2>💬 Chat Room: <span id="room-name">general</span></h2>
                    <small>Logged in as: <strong id="current-user"></strong></small>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="online-users" id="online-users">
                <strong>●</strong> Online users will appear here
            </div>

            <div id="messages"></div>

            <div id="typing-indicator"></div>

            <div class="message-input-container">
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Send 📤</button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let token;
        let currentUser;
        let currentRoom = 'general';
        const API_URL = 'http://localhost:3009';

        function getDeviceId() {
            let deviceId = localStorage.getItem('chat_device_id')
            if(!deviceId){
                deviceId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8)
                    return v.toString(16)
                })
                localStorage.setItem('chat_device_id', deviceId)
            }
            return deviceId
        }

        const DEVICE_ID = getDeviceId()

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // Clear errors
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.success-message').forEach(el => el.style.display = 'none');
        }

        // Handle Registration
        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-device-id': DEVICE_ID
                    },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Registration failed');
                }

                // Registration successful
                successEl.textContent = 'Account created successfully! Logging you in...';
                successEl.style.display = 'block';

                // Store token and user - handle nested response
                token = data.data?.access_token || data.access_token;
                currentUser = data.data?.user?.username || data.user?.username || data.username || username;

                if(token) {
                    localStorage.setItem('chat_token', token)
                    localStorage.setItem('chat_username', currentUser)
                }
                console.log('Token:', token, 'User:', currentUser); // Debug

                // Wait a moment then show chat
                setTimeout(() => {
                    showChat();
                }, 1000);

            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        }

        // Handle Login
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-device-id' : DEVICE_ID
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                // Store token and user - handle nested response
                token = data.data?.access_token || data.access_token;
                currentUser = data.data?.user?.username || data.user?.username || data.username || username;

                if(token){
                    localStorage.setItem('chat_token', token)
                    localStorage.setItem('chat_username', currentUser)
                }
                console.log('Token:', token, 'User:', currentUser); // Debug

                showChat();

            } catch (error) {
                errorEl.textContent = error.message || 'Login failed. Please check your credentials.';
                errorEl.style.display = 'block';
            }
        }

        // Show chat interface
        function showChat() {
            if (!token) {
                alert('Authentication failed - no token received');
                return;
            }

            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('chat-container').style.display = 'block';
            document.getElementById('current-user').textContent = currentUser;
            connectWebSocket();
        }

        // Logout
        function logout() {
            if (socket) {
                socket.disconnect();
            }
            
            token = null;
            currentUser = null;

            localStorage.removeItem('chat_token');
            localStorage.removeItem('chat_username')
            
            document.getElementById('auth-container').style.display = 'block';
            document.getElementById('chat-container').style.display = 'none';
            document.getElementById('messages').innerHTML = '';
            
            // Clear form fields
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        // Connect to WebSocket
        function connectWebSocket() {
            console.log('Connecting with token:', token ? 'Yes' : 'No');

            socket = io(API_URL, {
                auth: {
                    token: `Bearer ${token}`
                },
                extraHeaders: {
                    Authorization: `Bearer ${token}`
                }
            });

            socket.on('connect', () => {
                console.log('Connected to WebSocket');
                displaySystemMessage('✅ Connected to chat server');
                socket.emit('joinRoom', { roomId: currentRoom });
            });

            socket.on('disconnect', () => {
                displaySystemMessage('❌ Disconnected from chat server');
            });

            socket.on('previousMessages', (messages) => {
                console.log('Received previous messages:', messages);
                messages.forEach(msg => {
                    displayMessage(
                        msg.user.username, 
                        msg.content, 
                        new Date(msg.createdAt),
                        msg.user.username === currentUser // Check if it's your message
                    );
                });
            });

            socket.on('newMessage', (message) => {
                console.log('Received new message:', message);
                displayMessage(
                    message.user.username, 
                    message.content, 
                    new Date(message.createdAt),
                    message.user.username === currentUser // Check if it's your message
                );
            });

            socket.on('userJoined', (data) => {
                displaySystemMessage(`👋 ${data.username} joined the chat`);
                updateOnlineUsers(data.activeUsers);
            });

            socket.on('userLeft', (data) => {
                if (data.username) {
                    displaySystemMessage(`👋 ${data.username} left the chat`);
                }
                updateOnlineUsers(data.activeUsers);
            });

            socket.on('userTyping', (data) => {
                if (data.isTyping) {
                    document.getElementById('typing-indicator').textContent = `${data.username} is typing...`;
                } else {
                    document.getElementById('typing-indicator').textContent = '';
                }
            });

            socket.on('connect_error', (err)=> {
                if(err.message === 'Unauthorized'){
                    localStorage.removeItem('chat_token')
                    localStorage.removeItem('chat_username')
                    handleLogin(event)
                    alert("session expired. please login again.")
                }
            })

            socket.on('exception', (error)=> {
                if (error === 'Whoah dude, slow down!' || error.message === 'Whoah dude, slow down!'){
                    displaySystemMessage('⚠️ Error: You are sending messages too fast. Please wait a moment.')
                }else {
                    console.error('Socket Exception', error)
                }
            })
        }

        // Send message
        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();

            if (content && socket) {
                socket.emit('sendMessage', {
                    content: content,
                    roomId: currentRoom
                });
                input.value = '';
            }
        }

        // Display message with proper styling
        function displayMessage(username, content, timestamp, isOwnMessage) {
            const messagesDiv = document.getElementById('messages');
            
            // Create wrapper
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isOwnMessage ? 'own' : 'other'}`;
            
            // Create message bubble
            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            
            // Only show username for other people's messages
            let messageHTML = '';
            if (!isOwnMessage) {
                messageHTML += `<div class="message-header">${username}</div>`;
            }
            
            messageHTML += `
                <div class="message-content">${content}</div>
                <div class="message-time">${timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
            `;
            
            messageEl.innerHTML = messageHTML;
            wrapper.appendChild(messageEl);
            messagesDiv.appendChild(wrapper);
            
            // Auto-scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Display system message
        function displaySystemMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = 'system-message';
            messageEl.textContent = text;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Update online users
        function updateOnlineUsers(users) {
            if (users && users.length > 0) {
                document.getElementById('online-users').innerHTML = 
                    `<strong>● ${users.length} online:</strong> ${users.join(', ')}`;
            }
        }

        // Handle key press
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Typing indicator
        let typingTimeout;
        document.addEventListener('DOMContentLoaded', async () => {
            const savedToken = localStorage.getItem('chat_token')
            const savedUser = localStorage.getItem('chat_username')
            if (savedToken) {
                try {
                    // 1. ASK THE BACKEND: "Is this token still good?"
                    const response = await fetch(`${API_URL}/auth/profile`, {
                        headers: { 'Authorization': `Bearer ${savedToken}`, 'x-device-id' : DEVICE_ID }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log("Session validated for:", data.data?.user.username);
                        
                        // 2. TOKEN IS GOOD -> Setup App
                        token = savedToken;
                        currentUser = data.data?.user.username;
                        showChat(); 
                    } else {
                        // 3. TOKEN EXPIRED -> Clean up
                        throw new Error('Session expired');
                    }
                } catch (err) {
                    console.log("Validation failed:", err.message);
                    logout(); // Clears storage and shows login form
                }
            } else {
                logout(); // No token found, show login
            }
            // if(savedToken && savedUser){
            //     console.log("Found active sessions for: ", savedUser);
            //     currentUser = savedUser
            //     token = savedToken

            //     showChat()
            // } else{
            //     document.getElementById('auth-container').style.display = 'block';
            //     document.getElementById('chat-container').style.display = 'none';
            // }
            const messageInput = document.getElementById('message-input');
            if (messageInput) {
                messageInput.addEventListener('input', () => {
                    if (socket) {
                        socket.emit('typing', { roomId: currentRoom, isTyping: true });
                        
                        clearTimeout(typingTimeout);
                        typingTimeout = setTimeout(() => {
                            socket.emit('typing', { roomId: currentRoom, isTyping: false });
                        }, 1000);
                    }
                });
            }
        });
    </script>
</body>
</html>
