<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestJS Chat Client</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { max-width: 1100px; width: 95%; margin: 20px; }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* ── AUTH ─────────────────────────────────────────── */
        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 450px;
            margin: 0 auto;
        }

        .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #eee; }
        .tab {
            flex: 1; padding: 15px; text-align: center; cursor: pointer;
            background: none; border: none; font-size: 16px; font-weight: 600;
            color: #999; transition: all 0.3s; border-bottom: 3px solid transparent;
        }
        .tab.active { color: #667eea; border-bottom-color: #667eea; }
        .tab:hover { color: #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 15px; transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }

        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        button:active { transform: translateY(0); }

        .error-message {
            color: #e74c3c; background: #ffe5e5; padding: 12px;
            border-radius: 8px; margin-top: 15px; font-size: 14px; display: none;
        }
        .success-message {
            color: #27ae60; background: #e5f7e5; padding: 12px;
            border-radius: 8px; margin-top: 15px; font-size: 14px; display: none;
        }

        /* ── CHAT LAYOUT ───────────────────────────────────── */
        .chat-container {
            display: none;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            height: 85vh;
            min-height: 560px;
        }

        .chat-layout {
            display: flex;
            height: 100%;
        }

        /* ── SIDEBAR ───────────────────────────────────────── */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
        }

        .sidebar-header .username {
            font-weight: 700;
            font-size: 15px;
        }

        .sidebar-header .sub {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .sidebar-section-label {
            padding: 10px 14px 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.07em;
            color: #999;
            text-transform: uppercase;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.15s;
            font-size: 14px;
            color: #333;
        }

        .sidebar-item:hover { background: #f0effe; }

        .sidebar-item.active {
            background: #f0effe;
            border-left-color: #667eea;
            color: #667eea;
            font-weight: 600;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar.online { box-shadow: 0 0 0 2px white, 0 0 0 4px #27ae60; }

        .sidebar-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .logout-sidebar-btn {
            margin: 10px 14px;
            padding: 8px;
            font-size: 13px;
            background: transparent;
            color: #e74c3c;
            border: 1.5px solid #e74c3c;
            border-radius: 8px;
            width: calc(100% - 28px);
            font-weight: 600;
            transition: background 0.2s;
        }
        .logout-sidebar-btn:hover { background: #ffe5e5; box-shadow: none; transform: none; }

        /* ── MAIN CHAT PANEL ───────────────────────────────── */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
        }

        .chat-panel-header .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-panel-header .header-info .name {
            font-weight: 700;
            font-size: 15px;
            color: #222;
        }

        .chat-panel-header .header-info .sub {
            font-size: 12px;
            color: #888;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f8;
            display: flex;
            flex-direction: column;
        }

        /* ── MESSAGES ──────────────────────────────────────── */
        .message-wrapper { display: flex; margin-bottom: 14px; animation: slideIn 0.25s ease; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message-wrapper.other { justify-content: flex-start; }
        .message-wrapper.other .message {
            background: white;
            color: #333;
            border-radius: 18px 18px 18px 4px;
            max-width: 68%;
            padding: 10px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .message-wrapper.other .message-header {
            font-weight: 700; color: #667eea; font-size: 12px; margin-bottom: 3px;
        }

        .message-wrapper.own { justify-content: flex-end; }
        .message-wrapper.own .message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
            max-width: 68%;
            padding: 10px 14px;
            box-shadow: 0 2px 6px rgba(102,126,234,0.25);
        }
        .message-wrapper.own .message-header {
            font-weight: 700; font-size: 12px; margin-bottom: 3px; opacity: 0.85;
        }

        .message-content { word-wrap: break-word; line-height: 1.45; font-size: 14.5px; }
        .message-time { font-size: 11px; opacity: 0.6; margin-top: 4px; text-align: right; }

        .system-message {
            text-align: center; color: #aaa; font-size: 12px;
            font-style: italic; margin: 8px 0; padding: 6px 12px;
            background: rgba(0,0,0,0.03); border-radius: 12px;
        }

        /* ── INPUT BAR ─────────────────────────────────────── */
        .input-bar {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
            background: white;
        }

        #message-input {
            flex: 1; padding: 10px 14px; border: 1.5px solid #e0e0e0;
            border-radius: 22px; font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        #message-input:focus { border-color: #667eea; }

        .send-btn {
            width: auto; padding: 10px 20px;
            border-radius: 22px; font-size: 14px;
        }

        #typing-indicator {
            padding: 0 16px 6px;
            color: #667eea;
            font-style: italic;
            font-size: 12px;
            min-height: 18px;
            background: white;
        }

        /* scrollbar */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        #messages::-webkit-scrollbar-thumb:hover { background: #667eea; }

        @media (max-width: 640px) {
            .sidebar { width: 60px; }
            .sidebar-item-name, .sidebar-section-label, .sidebar-header .sub, .sidebar-header .username { display: none; }
            .logout-sidebar-btn { width: 36px; height: 36px; padding: 0; font-size: 16px; margin: 8px auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 NestJS Chat</h1>

    <!-- AUTH -->
    <div class="auth-container" id="auth-container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab(event,'login')">Login</button>
            <button class="tab" onclick="switchTab(event,'register')">Register</button>
        </div>

        <div class="tab-content active" id="login-tab">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Login</button>
                <div class="error-message" id="login-error"></div>
            </form>
        </div>

        <div class="tab-content" id="register-tab">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="register-username" placeholder="Choose a username" required minlength="3">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="register-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="register-password" placeholder="Choose a password" required minlength="6">
                </div>
                <button type="submit">Create Account</button>
                <div class="error-message" id="register-error"></div>
                <div class="success-message" id="register-success"></div>
            </form>
        </div>
    </div>

    <!-- CHAT -->
    <div class="chat-container" id="chat-container">
        <div class="chat-layout">

            <!-- SIDEBAR -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="username" id="sidebar-username">—</div>
                    <div class="sub">You</div>
                </div>

                <div class="sidebar-section-label">Channels</div>
                <div class="sidebar-item active" id="sidebar-general" onclick="switchToGeneral()">
                    <div class="avatar" style="background:#667eea;">#</div>
                    <span class="sidebar-item-name">General</span>
                </div>

                <div class="sidebar-section-label">Online Users</div>
                <div id="user-list"></div>

                <div style="flex:1;"></div>
                <button class="logout-sidebar-btn" onclick="logout()">Logout</button>
            </div>

            <!-- MAIN PANEL -->
            <div class="chat-panel">
                <div class="chat-panel-header">
                    <div class="header-avatar" id="header-avatar">#</div>
                    <div class="header-info">
                        <div class="name" id="header-name">General</div>
                        <div class="sub" id="header-sub">Public channel</div>
                    </div>
                </div>

                <div id="messages"></div>
                <div id="typing-indicator"></div>

                <div class="input-bar">
                    <input type="text" id="message-input" placeholder="Type a message…" onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">Send ➤</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    let socket;
    let token;
    let currentUser;
    let currentUserId;
    let activeRoomId = 'general';
    let activeRecipientId = null;
    let currentRoom = 'general';
    let onlineUsers = [];        // [{id, username}, ...]
    const API_URL = 'http://localhost:3009';

    /* ── DEVICE ID ─────────────────────────────────────── */
    function getDeviceId() {
        let id = localStorage.getItem('chat_device_id');
        if (!id) {
            id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
            localStorage.setItem('chat_device_id', id);
        }
        return id;
    }
    const DEVICE_ID = getDeviceId();

    /* ── TABS ──────────────────────────────────────────── */
    function switchTab(event, tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabName + '-tab').classList.add('active');
        document.querySelectorAll('.error-message, .success-message').forEach(el => el.style.display = 'none');
    }

    /* ── REGISTER ──────────────────────────────────────── */
    async function handleRegister(event) {
        event.preventDefault();
        const username = document.getElementById('register-username').value;
        const email    = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const errorEl  = document.getElementById('register-error');
        const successEl= document.getElementById('register-success');
        errorEl.style.display = 'none'; successEl.style.display = 'none';
        try {
            const res  = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-device-id': DEVICE_ID },
                body: JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Registration failed');
            successEl.textContent = 'Account created! Logging you in…';
            successEl.style.display = 'block';
            token       = data.data?.access_token || data.access_token;
            currentUser = data.data?.user?.username || data.user?.username || username;
            currentUserId = data.data?.user?.id || data.user?.id;
            if (token) { localStorage.setItem('chat_token', token); localStorage.setItem('chat_username', currentUser); }
            setTimeout(showChat, 1000);
        } catch (err) { errorEl.textContent = err.message; errorEl.style.display = 'block'; }
    }

    /* ── LOGIN ─────────────────────────────────────────── */
    async function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const errorEl  = document.getElementById('login-error');
        errorEl.style.display = 'none';
        try {
            const res  = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-device-id': DEVICE_ID },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Login failed');
            token       = data.data?.access_token || data.access_token;
            currentUser = data.data?.user?.username || data.user?.username || username;
            currentUserId = data.data?.user?.id || data.user?.id;
            if (token) { localStorage.setItem('chat_token', token); localStorage.setItem('chat_username', currentUser); }
            showChat();
        } catch (err) { errorEl.textContent = err.message; errorEl.style.display = 'block'; }
    }

    /* ── SHOW CHAT ─────────────────────────────────────── */
    function showChat() {
        if (!token) { alert('Authentication failed — no token received'); return; }
        document.getElementById('auth-container').style.display  = 'none';
        document.getElementById('chat-container').style.display  = 'block';
        document.getElementById('sidebar-username').textContent  = currentUser;
        connectWebSocket();
    }

    /* ── LOGOUT ────────────────────────────────────────── */
    function logout() {
        if (socket) socket.disconnect();
        token = null; currentUser = null; currentUserId = null;
        localStorage.removeItem('chat_token'); localStorage.removeItem('chat_username');
        document.getElementById('auth-container').style.display = 'block';
        document.getElementById('chat-container').style.display = 'none';
        document.getElementById('messages').innerHTML = '';
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
    }

    /* ── WEBSOCKET ─────────────────────────────────────── */
    function connectWebSocket() {
        socket = io(API_URL, {
            auth: { token: `Bearer ${token}` },
            extraHeaders: { Authorization: `Bearer ${token}` }
        });

        socket.on('connect', () => {
            displaySystemMessage('✅ Connected');
            socket.emit('joinRoom', { roomId: currentRoom });
        });

        socket.on('disconnect', () => displaySystemMessage('❌ Disconnected'));

        socket.on('previousMessages', messages => {
            document.getElementById('messages').innerHTML = '';
            messages.forEach(msg => displayMessage(
                msg.user.username, msg.content, new Date(msg.createdAt),
                msg.user.username === currentUser
            ));
        });

        socket.on('newMessage', message => {
            // Only show in current active room
            console.log('newMessage received:', message)
            console.log('activeRoomId:', activeRoomId)
            const inGeneral  = activeRoomId === 'general' && !message.recipientId;
            const inPrivate  = message.roomId && message.roomId === activeRoomId;
            if (inGeneral || inPrivate) {
                displayMessage(
                    message.user.username, message.content, new Date(message.createdAt),
                    message.user.username === currentUser, message.id
                );
            }
        });

        socket.on('userJoined', data => {
            displaySystemMessage(`👋 ${data.username} joined`);
            if (data.activeUsers) updateUserList(data.activeUsers);
        });

        socket.on('userLeft', data => {
            if (data.username) displaySystemMessage(`👋 ${data.username} left`);
            if (data.activeUsers) updateUserList(data.activeUsers);
        });

        socket.on('userTyping', data => {
            document.getElementById('typing-indicator').textContent =
                data.isTyping ? `${data.username} is typing…` : '';
        });

        socket.on('privateChatHistory', ({ roomId, history }) => {
            if (roomId !== activeRoomId) return;
            document.getElementById('messages').innerHTML = '';
            if(history.length === 0){
                displaySystemMessage('No messages yet. Say Hello!')
                return;
            }
            history.forEach(msg => displayMessage(
                msg.user.username, msg.content, new Date(msg.createdAt),
                msg.user.username === currentUser, msg.id
            ));
        });

        socket.on('connect_error', err => {
            if (err.message === 'Unauthorized') {
                localStorage.removeItem('chat_token');
                localStorage.removeItem('chat_username');
                logout();
                alert('Session expired. Please log in again.');
            }
        });

        socket.on('exception', error => {
            const msg = error?.message || error;
            if (msg === 'Whoah dude, slow down!') {
                displaySystemMessage('⚠️ Sending too fast — slow down.');
            } else {
                console.error('Socket Exception', error);
            }
        });
    }

    /* ── SWITCH TO GENERAL ─────────────────────────────── */
    function switchToGeneral() {
        renderedMessageIds.clear()
        if(activeRoomId && activeRoomId !== 'general'){
            socket.emit('leavePrivateRoom', {roomId: activeRoomId})
        }
        activeRoomId      = 'general';
        activeRecipientId = null;

        document.getElementById('header-avatar').textContent = '#';
        document.getElementById('header-avatar').style.background = '#667eea';
        document.getElementById('header-name').textContent  = 'General';
        document.getElementById('header-sub').textContent   = 'Public channel';

        setActiveSidebarItem('sidebar-general');
        document.getElementById('messages').innerHTML = '';

        if (socket) socket.emit('joinRoom', { roomId: 'general' });
    }

    /* ── OPEN PRIVATE CHAT ─────────────────────────────── */
    function openPrivateChat(userId, username) {
        renderedMessageIds.clear()
        if (userId === currentUserId || username === currentUser) return;

        activeRecipientId = userId;
        activeRoomId      = [currentUserId, userId].sort().join('--');

        document.getElementById('header-avatar').textContent   = initials(username);
        document.getElementById('header-avatar').style.background = avatarColor(username);
        document.getElementById('header-name').textContent     = username;
        document.getElementById('header-sub').textContent      = 'Private conversation';

        setActiveSidebarItem('user-' + userId);
        document.getElementById('messages').innerHTML = '';
        // displaySystemMessage('Loading messages…');

        socket.emit('joinPrivateChat', { recipientId: userId }, response => {
            console.log('Joined private room', response?.roomId);
            activeRoomId = response.roomId
            console.log('Active room set to:', activeRoomId)
        });
    }

    /* ── SIDEBAR HELPERS ───────────────────────────────── */
    function setActiveSidebarItem(id) {
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
    }

    function updateUserList(users) {
        // users can be array of strings or array of {id, username}
        onlineUsers = users;
        const list  = document.getElementById('user-list');
        list.innerHTML = '';

        users.forEach(u => {
            const uname = typeof u === 'string' ? u : u.username;
            const uid   = typeof u === 'object' ? u.id : u;
            if (uname === currentUser) return; // skip self

            const item = document.createElement('div');
            item.className  = 'sidebar-item';
            item.id         = 'user-' + uid;
            item.onclick    = () => openPrivateChat(uid, uname);

            item.innerHTML = `
                <div class="avatar online" style="background:${avatarColor(uname)};">${initials(uname)}</div>
                <span class="sidebar-item-name">${uname}</span>
            `;
            list.appendChild(item);
        });
    }

    function initials(name) {
        return name.slice(0, 2).toUpperCase();
    }

    function avatarColor(name) {
        const colors = ['#667eea','#764ba2','#f093fb','#4facfe','#43e97b','#fa709a','#fee140'];
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return colors[Math.abs(hash) % colors.length];
    }

    /* ── SEND MESSAGE ──────────────────────────────────── */
    function sendMessage() {
        const input   = document.getElementById('message-input');
        const content = input.value.trim();
        if (!content || !socket) return;

        const payload = {content}
        if(activeRecipientId){
            payload.recipientId = activeRecipientId
        } else {
            payload.roomId = 'general'
        }
        socket.emit('sendMessage', payload);
        input.value = '';
    }

    /* ── DISPLAY HELPERS ───────────────────────────────── */
    const renderedMessageIds = new Set()
    function displayMessage(username, content, timestamp, isOwn, id = null) {
        if(id && renderedMessageIds.has(id)) return;
        if(id) renderedMessageIds.add(id);
        const wrap = document.createElement('div');
        wrap.className = `message-wrapper ${isOwn ? 'own' : 'other'}`;

        const bubble = document.createElement('div');
        bubble.className = 'message';

        let html = '';
        if (!isOwn) html += `<div class="message-header">${username}</div>`;
        html += `<div class="message-content">${content}</div>
                 <div class="message-time">${timestamp.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>`;

        bubble.innerHTML = html;
        wrap.appendChild(bubble);

        const box = document.getElementById('messages');
        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
    }

    function displaySystemMessage(text) {
        const box = document.getElementById('messages');
        const el  = document.createElement('div');
        el.className   = 'system-message';
        el.textContent = text;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    /* ── KEY PRESS ─────────────────────────────────────── */
    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    /* ── TYPING INDICATOR ──────────────────────────────── */
    let typingTimeout;

    /* ── BOOT ──────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', async () => {
        const savedToken = localStorage.getItem('chat_token');
        if (savedToken) {
            try {
                const res = await fetch(`${API_URL}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${savedToken}`, 'x-device-id': DEVICE_ID }
                });
                if (!res.ok) throw new Error('Session expired');
                const data = await res.json();
                token         = savedToken;
                currentUser   = data.data?.user?.username;
                currentUserId = data.data?.user?.id;
                showChat();
            } catch {
                logout();
            }
        } else {
            document.getElementById('auth-container').style.display = 'block';
        }

        const input = document.getElementById('message-input');
        if (input) {
            input.addEventListener('input', () => {
                if (socket) {
                    socket.emit('typing', { roomId: activeRoomId, isTyping: true });
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        socket.emit('typing', { roomId: activeRoomId, isTyping: false });
                    }, 1000);
                }
            });
        }
    });
</script>
</body>
</html>
