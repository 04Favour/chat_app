services:
  db:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_chat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - chat_app

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - chat_app

volumes:
  postgres_data:

networks:
  chat_app:
    driver: bridge